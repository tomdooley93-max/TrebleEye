<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071229">
<title>Svanen Hockey Games</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Svanen">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=UnifrakturMaguntia&family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Layout: arenans resultattavla – mörk is-natt, en stor tavla överst, tumvänlig flikrad i botten */
:root{
--bg:#071229; --ice:#0e1f40; --ice2:#16305c; --line:#26487e;
--fg:#f5f8fd; --dim:#a9bbd8; --amber:#e8283c; --pink:#4f8fe8; --mint:#ffffff; --red:#ff6b6b; --on:#ffffff; --onm:#071229;
--display:"Bungee","Arial Black",Impact,sans-serif;
--body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{min-height:100%}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;
background-image:radial-gradient(1200px 500px at 50% -200px,#1b3f80 0%,transparent 70%);
background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:var(--display);font-size:clamp(20px,5vw,30px);line-height:1;letter-spacing:.5px}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--amber);margin-top:4px}
.brand .sw{color:var(--pink)}
h2{font-family:var(--display);font-weight:400;font-size:20px;margin:22px 0 10px;text-wrap:balance}
h3{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:18px 0 8px}
.card{background:var(--ice);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.muted{color:var(--dim);font-size:14px}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0;width:100%}
input[type=number]{font-variant-numeric:tabular-nums}
.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;font-weight:700;background:var(--ice2);border:1px solid var(--line);min-height:46px;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--amber);color:var(--on);border-color:transparent}
.btn.pink{background:var(--pink);color:#fff;border-color:transparent}
.btn.mint{background:var(--mint);color:var(--onm);border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:6px 11px;font-size:14px;border-radius:9px}
.btn.danger{color:var(--red)}
.btn.armed{background:var(--red);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--ice2);font-size:13px;font-weight:600;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.banner{background:linear-gradient(90deg,#c8102e,#1d4fa8);color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px;font-weight:600}
/* Flikar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(5,12,28,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);
padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:620px}
nav.tabs button{padding:8px 2px;border-radius:10px;font-size:12px;font-weight:700;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current=page]{color:#fff;background:var(--amber)}
/* Tavlan */
.board{background:linear-gradient(180deg,#0a1222,#050a14);border:2px solid #000;border-radius:18px;padding:16px;box-shadow:0 0 0 1px var(--line),0 20px 50px -20px #000 inset}
.board .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.board .tname{font-weight:800;font-size:clamp(15px,3.6vw,22px);text-transform:uppercase;letter-spacing:1px;overflow-wrap:anywhere}
.board .score{font-family:var(--display);font-size:clamp(56px,15vw,110px);line-height:1;color:var(--amber);text-shadow:0 0 18px rgba(232,40,60,.7);font-variant-numeric:tabular-nums}
.board .mid{font-family:var(--display);color:var(--dim);font-size:28px}
.board .clock{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.board .time{font-family:var(--display);font-size:34px;color:var(--mint);text-shadow:0 0 14px rgba(255,255,255,.35);font-variant-numeric:tabular-nums;min-width:4.2em;text-align:center}
.board .pens{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:13px;color:var(--pink)}
.board .pens div:last-child{text-align:right}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.actions .btn{flex-direction:column;min-height:74px;font-size:14px;padding:8px 4px}
.actions .btn b{font-family:var(--display);font-weight:400;font-size:18px}
@media (max-width:480px){.actions{grid-template-columns:repeat(2,1fr)}}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{display:flex;gap:10px;align-items:center;background:var(--ice);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.log .when{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;min-width:56px}
.log .what{flex:1;min-width:0}
.tag{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:6px;margin-right:6px}
.t-goal{background:var(--amber);color:var(--on)}.t-pen{background:var(--pink);color:#fff}.t-warn{background:#ffe9a8;color:#3b2a00}.t-jager{background:#3ee0a8;color:#00261a}.t-adj{background:#a34bff;color:#fff}
/* Tabeller */
.tbl-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;background:var(--ice)}
th,td{padding:10px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);background:var(--ice2)}
th:first-child,td:first-child{text-align:left}
td.name{font-weight:700;text-align:left}
tr:last-child td{border-bottom:0}
td.pts{font-family:var(--display);color:var(--amber);font-size:18px}
.rank{font-family:var(--display);color:var(--dim);width:2em}
tr.lead .rank{color:var(--amber)}
.flag{color:var(--pink);font-weight:700}
/* Modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(3,7,15,.78);display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--ice);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:720px;max-height:88vh;overflow:auto;
padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin-top:0}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.pick .col h3{margin:0 0 4px;display:flex;align-items:center;gap:6px}
.pbtn{padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);text-align:left;font-weight:600;overflow-wrap:anywhere;display:flex;gap:8px;align-items:center}
.pbtn .nr{font-family:var(--display);color:var(--dim);min-width:1.8em}
.pbtn .hist{margin-left:auto;font-size:12px;color:var(--pink)}
.pbtn.sel{border-color:var(--amber);background:#3a1220}
/* Jäger */
.jager{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:24px;
background:radial-gradient(circle at 50% 40%,#0f6b4c 0%,#06281d 55%,#020c08 100%)}
.jager .k{font-family:var(--display);color:#ffc23d;font-size:clamp(28px,8vw,56px);line-height:1;animation:pulse 0.9s ease-in-out infinite alternate}
.jager .who{font-family:var(--display);font-size:clamp(38px,12vw,96px);line-height:1.05;color:#fff;overflow-wrap:anywhere;max-width:100%}
.jager .team{font-weight:800;letter-spacing:3px;text-transform:uppercase}
.jager.rolling .who{opacity:.85;filter:blur(.5px)}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--amber);color:var(--on);font-weight:800;padding:10px 18px;border-radius:99px;box-shadow:0 8px 30px rgba(0,0,0,.4);display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);width:max-content}
.toast .undo{background:rgba(0,0,0,.25);color:#fff;border-radius:99px;padding:6px 12px;font-weight:800;min-height:34px}
.log .pin-in{padding:6px 8px;border-radius:8px;background:transparent;border-color:transparent}
.log .pin-in:focus{background:var(--bg);border-color:var(--line)}
.goalflash{position:fixed;inset:0;z-index:65;display:flex;align-items:center;justify-content:center;pointer-events:none;font-family:var(--display);font-size:clamp(70px,22vw,200px);color:var(--amber);text-shadow:0 0 40px rgba(232,40,60,.85);animation:gf 1.4s ease-out forwards}
@keyframes gf{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.1);opacity:1}70%{opacity:1}100%{transform:scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.jager .k,.goalflash{animation:none}.btn{transition:none}}
.fk-in{width:5.5em!important;text-align:center}
.matchcard{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.matchcard .res{font-family:var(--display);color:var(--amber);font-size:22px;font-variant-numeric:tabular-nums}
.live{color:var(--mint);font-weight:800;font-size:12px;letter-spacing:2px}
.empty{padding:28px 16px;text-align:center;color:var(--dim)}
.jalert{background:radial-gradient(circle at 30% 30%,#0f6b4c,#06281d);border:2px solid #3ee0a8;border-radius:16px;padding:16px;text-align:center;margin-bottom:12px}
.jalert .k{font-family:var(--display);color:#ffc23d;font-size:22px}
.jalert .who{font-family:var(--display);font-size:clamp(30px,9vw,54px);line-height:1.1;overflow-wrap:anywhere}
.qr{background:#fff;border-radius:14px;padding:12px;width:min(280px,100%);margin:0 auto}
.qr svg{display:block;width:100%;height:auto}
.foot{text-align:center;margin-top:28px}
.minibar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:10px;justify-content:space-between;background:#050a14;border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:12px;box-shadow:0 10px 24px -12px #000}
.minibar .mt{font-family:var(--display);font-size:24px;color:var(--mint);font-variant-numeric:tabular-nums}
.minibar .ms{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;flex:1}
.adj{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.emblem{display:block;width:min(66vw,290px);height:auto;margin:-6px auto 8px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
.emblem.sm{width:min(42vw,180px)}
.foot a{color:var(--dim);font-size:13px}
.fktbl td:first-child{white-space:normal}
body.cdmode,html:has(body.cdmode){overflow:hidden;height:100%}
body.cdmode .wrap{height:calc(100dvh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;padding-block:max(16px,2.5dvh) max(12px,env(safe-area-inset-bottom,0px))}
body.cdmode header.top{display:none}
body.cdmode #app{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.6dvh}
body.cdmode .emblem{width:auto;height:min(34dvh,72vw);max-width:100%;margin:0}
body.cdmode .cd{gap:1.6dvh;margin:0}
body.cdmode .cd-big span{font-size:min(30vw,16dvh)}
body.cdmode .cd-big small{margin-top:.6dvh}
body.cdmode .cd-row b{font-size:min(9vw,4.6dvh)}
body.cdmode .foot{margin-top:1dvh}
details.sec{padding:0}details.sec>summary{list-style:none;cursor:pointer;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);flex:none;margin-right:4px;transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(-135deg)}
details.sec>summary b{font-size:17px;display:block}details.sec>summary small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.sec-in{padding:0 14px 14px}
.yrs{margin-bottom:10px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}.yrs a{color:var(--fg);font-weight:800;font-size:15px}
.jg2{--or:#f26b21;--cr:#f4e3c1;--gd:#e8b04b;position:fixed;inset:0;z-index:60;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 40%,#1e5a3b 0%,#0d3324 42%,#04140d 75%,#000 100%)}
.jg-rays{position:absolute;left:50%;top:42%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(rgba(242,107,33,.16) 0 7deg,transparent 7deg 15deg);animation:jgspin 16s linear infinite;opacity:0;transition:opacity .6s;-webkit-mask-image:radial-gradient(circle,#000 0,#000 18%,transparent 55%);mask-image:radial-gradient(circle,#000 0,#000 18%,transparent 55%)}
.jg2.go .jg-rays{opacity:1}.jg2.won .jg-rays{animation-duration:5s;background:repeating-conic-gradient(rgba(242,107,33,.38) 0 7deg,rgba(232,176,75,.08) 7deg 15deg)}
.jg-beams i{position:absolute;bottom:-10vh;width:36vw;height:130vh;background:linear-gradient(to top,rgba(244,227,193,.2),transparent 70%);filter:blur(12px);transform-origin:50% 100%;mix-blend-mode:screen}
.jg-beams i:first-child{left:5vw;animation:jgbeamL 2.4s ease-in-out infinite alternate}.jg-beams i:last-child{right:5vw;animation:jgbeamR 2.1s ease-in-out infinite alternate}
.jg-flash{position:absolute;inset:0;background:var(--cr);opacity:0;pointer-events:none}
.jg2.go .jg-flash{animation:jgflash .5s 1.25s ease-out}.jg2.won .jg-flash{background:var(--or);animation:jgflash2 .7s ease-out}
.jg-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;width:min(640px,100%)}
.jg2.go .jg-stage{animation:jgshake .45s 1.3s}.jg2.won .jg-stage{animation:jgshake .55s}
.jg-antl{width:min(210px,52vw);color:var(--gd);margin-bottom:-24px;opacity:0;filter:drop-shadow(0 0 14px rgba(232,176,75,.7))}
.jg2.go .jg-antl{opacity:1}.jg2.won .jg-antl{color:var(--or);filter:drop-shadow(0 0 22px rgba(242,107,33,.95))}
.jg-title{line-height:.95;display:flex;flex-direction:column;opacity:0}
.jg-title span:first-child{font-family:"UnifrakturMaguntia","Old English Text MT",serif;font-size:clamp(76px,24vw,150px);color:var(--cr);-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:0 0 28px rgba(242,107,33,.55),0 6px 0 #000}
.jg-title span+span{font-family:var(--display);color:var(--or);font-size:clamp(30px,9vw,58px);letter-spacing:4px;text-shadow:0 0 22px rgba(242,107,33,.6),0 4px 0 #000}
.jg2.go .jg-title{animation:jgslam .55s .9s cubic-bezier(.2,1.6,.4,1) forwards}
.jg2.spin .jg-title{animation:jgslam .55s cubic-bezier(.2,1.6,.4,1) forwards,jgpulse .5s .6s ease-in-out infinite alternate}
.jg-sub{font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--cr);opacity:0;transition:opacity .4s .5s;font-size:15px}.jg2.ready .jg-sub{opacity:1}
.jg2.won .jg-sub{font-family:var(--display);font-weight:400;font-size:clamp(22px,6.5vw,34px);letter-spacing:2px;color:var(--or);text-shadow:0 0 18px rgba(242,107,33,.7);animation:jgup .45s .1s both}
.jg-win{--h:clamp(60px,16vw,100px);position:relative;width:100%;height:calc(var(--h)*2);overflow:hidden;border-radius:14px;background:linear-gradient(#000,#0b1f16 50%,#000);border:4px solid var(--or);box-shadow:0 0 0 3px #000,0 0 0 5px var(--cr),0 0 40px rgba(242,107,33,.45),inset 0 0 0 2px var(--gd),inset 0 0 34px rgba(0,0,0,.9);transform:scale(.6);opacity:0;transition:transform .5s cubic-bezier(.2,1.5,.4,1) .25s,opacity .3s .25s}
.jg2.ready .jg-win{transform:none;opacity:1}.jg-reel{opacity:0;transition:opacity .2s}.jg2.spin .jg-reel{opacity:1}
.jg-cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:calc(var(--h)*1.5);color:var(--or);text-shadow:0 0 30px rgba(242,107,33,.9),0 4px 0 #000;z-index:1;pointer-events:none}.jg-cd.pop{animation:jgcd .8s ease-out both}
@keyframes jgcd{0%{transform:scale(2.4);opacity:0}25%{transform:scale(1);opacity:1}75%{opacity:1}100%{transform:scale(.6);opacity:0}}
.jg-antl path{stroke-dasharray:140;stroke-dashoffset:140}.jg2.go .jg-antl path{animation:jgdraw 1.1s .2s ease-out forwards}@keyframes jgdraw{to{stroke-dashoffset:0}}
.jg-reel{padding-top:calc(var(--h)*.5)}
.jg-mark{position:absolute;left:0;right:0;top:calc(var(--h)*.5);height:var(--h);border-block:2px solid var(--gd);background:linear-gradient(90deg,transparent,rgba(242,107,33,.14),transparent);pointer-events:none}
.jg-reel div{height:var(--h);line-height:var(--h);font-family:var(--display);font-size:clamp(32px,10vw,68px);color:var(--cr);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 14px;text-shadow:0 0 10px var(--c)}
.jg2.spin:not(.won) .jg-reel{filter:blur(1.2px)}
.jg2.won .jg-win{animation:jgwin .6s cubic-bezier(.2,1.6,.4,1);box-shadow:0 0 0 3px #000,0 0 0 6px var(--cr),0 0 90px rgba(242,107,33,.9),inset 0 0 0 2px var(--gd),inset 0 0 24px rgba(242,107,33,.35)}
.jg2.won .jg-reel div:not(.fin){opacity:.18;transition:opacity .4s}
.jg2.won .jg-reel div.fin{color:#fff;text-shadow:0 0 6px #fff,0 0 26px var(--or)}
.jg-team{font-weight:800;letter-spacing:4px;text-transform:uppercase;font-size:16px;min-height:1.4em;margin-top:-6px}
.jg2.won .jg-team{animation:jgup .5s .2s both}.jg2.won #jbtns{animation:jgup .5s .4s both}
.jg-skal{font-size:20px;background:var(--or)!important;color:#1a0a00!important;box-shadow:0 0 0 2px #000,0 0 0 4px var(--cr),0 0 30px rgba(242,107,33,.6)}
.jg2 [data-act=jagerAgain]{background:rgba(0,0,0,.5);border-color:var(--gd);color:var(--cr)}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function genRun(){
const txt=($("#genList")?.value||"");ui.genText=txt;
const n=Math.max(2,Math.min(8,+($("#genN")?.value||2)));ui.genN=n;
const ppl=txt.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*?)[\s:]+([1-5])$/);return m?{name:m[1].trim(),lvl:+m[2]}:{name:x,lvl:3}});
if(ppl.length<n){toast("För få deltagare för "+n+" lag");return}
const order=shuffle(ppl).sort((a,b)=>b.lvl-a.lvl);
const teams=shuffle(FUN_NAMES).slice(0,n).map((name,i)=>({name,color:COLORS[i%COLORS.length],players:[],sum:0}));
order.forEach((p,i)=>{const r=Math.floor(i/n),k=i%n,idx=r%2?n-1-k:k;teams[idx].players.push(p);teams[idx].sum+=p.lvl});
ui.gen=teams;render();
}

for(let i=0;i<160;i++)parts.push({x:cv.width/2,y:cv.height*.45,vx:(Math.random()-.5)*26,vy:-Math.random()*26-6,r:Math.random()*8+4,c:cols[i%cols.length],a:Math.random()*6,life:120+Math.random()*60});
if(!raf)raf=requestAnimationFrame(step);

function step(){

for(const p of parts){p.vy+=.6;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()}

rpc("svanen_set_pin",{p_old:PIN,p_new:n}).then(()=>{PIN=n.toLowerCase();lsSet(KEY+"-pin",PIN);$("#newPin").value="";toast("Koden är bytt")}).catch(e=>toast(e.code==="28000"?"Din gamla kod gäller inte":"Gick inte att byta kod"));return}

if(k==="addPlayer"){const n=$("#pn-"+id).value.trim();if(!n)return;team(id).players.push({id:uid(),name:n,nr:$("#pnr-"+id).value.trim()});save();render();$("#pn-"+id)?.focus();return}

startMatch(h,a);ui.pair=null;toast("Nedsläpp!")}

if(k==="addAdj"){const sg=+(ev.submitter?.dataset.sign||1),p=Math.abs(+$("#ap-"+id).value)*sg;if(!p){toast("Skriv antal poäng först");return}S.fk.adj.push({id:uid(),team:id,pts:p,note:$("#an-"+id).value.trim()||"Justering"})}

document.addEventListener("change",ev=>{
const el=ev.target,k=el.dataset.change;
if(el.id==="sndFile"){const f=el.files&&el.files[0];if(!f)return;if(f.size>20e6){toast("Filen är för stor (max 20 MB)");return}toast("Sparar låten…");
f.arrayBuffer().then(async ab=>{await idbPut(ab);SND.name=f.name;lsSet(KEY+"-jsname",f.name);await loadSnd();toast(sndBuf?"Låten är sparad på den här enheten":"Kunde inte läsa ljudfilen");render()}).catch(()=>toast("Kunde inte spara låten"));return}
if(!k)return;
const m=curMatch();
if(k==="teamName"){const v=el.value.trim();if(v)team(el.dataset.id).name=v;else{el.value=team(el.dataset.id).name;return}}
if(k==="pName"||k==="pNr"){const x=player(el.dataset.id);if(!x)return;const v=el.value.trim();if(k==="pName"){if(!v){el.value=x.p.name;return}x.p.name=v}else x.p.nr=v}
if(k==="period"&&m){m.period=el.value;m.pStart=elapsed(m);save();render();return}
if(k==="fkName"){const e=S.fk.events.find(x=>x.id===el.dataset.id);if(e&&el.value.trim())e.name=el.value.trim()}
if(k==="fkScore"){(S.fk.scores[el.dataset.ev]??={})[el.dataset.t]=el.value===""?"":+el.value;save();return}
if(k==="set")S.settings[el.dataset.k]=+el.value||0;
if(k==="setb")S.settings[el.dataset.k]=el.checked;
if(k==="setStart"){if(el.value){S.settings.start=el.value;toast("Nedsläpp: "+new Date(Date.parse(el.value)).toLocaleString("sv-SE",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}))}}
if(k==="spCid"){SP.cid=el.value.trim();spSave();render();return}
if(k==="spLink"){SP.link=el.value.trim();spSave();if(SP.link&&!spUri(SP.link))toast("Länken känns inte igen. Kopiera den via Dela > Kopiera länk i Spotify.");render();return}
if(k==="spDev"){SP.dev=el.value;spSave();return}
if(k==="sndOff"){SND.off=Math.max(0,+el.value||0);lsSet(KEY+"-jsoff",String(SND.off));return}
if(k==="swWho"){const l=SW.laps.find(x=>x.id===el.dataset.id);if(l){l.who=el.value;swSave();render()}return}
if(k==="sets"){S.settings[el.dataset.k]=el.value;save();render();return}
if((k==="set"||k==="setb"||k==="setStart")&&ui.tab==="mer"){save();render();return}
if(k==="set"&&/^(periods)$/.test(el.dataset.k)){save();render();return}
save();
});
document.addEventListener("input",e=>{if(e.target.id==="genList")ui.genText=e.target.value});
document.addEventListener("toggle",e=>{if(e.target.id==="genBox")ui.genOpen=e.target.open;const k=e.target.dataset&&e.target.dataset.sec;if(k){(ui.sec||(ui.sec={}))[k]=e.target.open;try{localStorage.setItem(KEY+"-sec",JSON.stringify(ui.sec))}catch(x){}}},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#layer").innerHTML&&!$("#jg"))closeLayer()});
setInterval(()=>{
if(!S)return;const m=curMatch();if(!m||!m.clock.running)return;
const onBoard=!isAdmin||(ui.tab==="match"&&!ui.openMatch);
const t=elapsed(m),c=$("#clock");if(c&&onBoard)c.textContent=fmt(pClock(m,t));
const mc=$("#mclock");if(mc)mc.textContent=fmt(pClock(m,t));
if(isAdmin&&PIN&&plenMs(m)&&pClock(m,t)===0){m.clock.ms=t;m.clock.running=false;save();render();
const last=String(m.period)===String(periodsList().slice(-2)[0]);const[h,a]=score(m);
toast(m.period==="OT"?"Förlängningen är slut!":last?(h===a&&fmtS().tie!=="draw"?"Full tid, oavgjort! Dags för "+(fmtS().tie==="so"?"straffar":"förlängning"):"Full tid! Tryck Slutsignal"):"Periodslut! Tryck Nästa period");try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}return}
if(onBoard&&$("#penH")){
const ap=side=>m.events.filter(e=>e.type==="pen"&&e.team===side&&e.clock+e.min*60000>t).map(e=>`${esc(pname(e.player))} ${fmt(e.clock+e.min*60000-t)}`).join("<br>");
$("#penH").innerHTML=ap(m.home);$("#penA").innerHTML=ap(m.away);
}
if(isAdmin&&PIN&&S.settings.autoJager&&m.nextJager!=null&&t>=m.nextJager&&!$("#layer").innerHTML){m.nextJager=null;startJager()}
},500);
setInterval(()=>{if(!SW.running)return;const e=$("#swTime");if(e)e.textContent=fmtT(swShown());
if(SW.mode==="down"&&swShown()===0){SW.ms=SW.down;SW.running=false;swSave();beep();try{navigator.vibrate&&navigator.vibrate([400,150,400])}catch(x){}toast("TID!");if(ui.tab==="femkamp"&&!isBusy())render()}},100);
let lock=null;async function wake(){try{if(!lock&&navigator.wakeLock)lock=await navigator.wakeLock.request("screen");lock?.addEventListener("release",()=>lock=null)}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&curMatch()?.clock.running)wake()});
addEventListener("resize",()=>{if(raf){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}});
{const q=new URLSearchParams(location.search);if(q.get("state")==="svanen"){const code=q.get("code"),fin=msg=>{try{sessionStorage.setItem(KEY+"-msg",msg)}catch(e){}location.replace(location.pathname+"#sekretariat")};
document.body.innerHTML='<div class="empty" style="padding-top:40vh">Kopplar Spotify…</div>';
if(code)spToken({grant_type:"authorization_code",code,redirect_uri:spRedir(),code_verifier:lsGet(SPK+"-v")||""}).then(()=>fin("Spotify är kopplat!"),e=>fin("Spotify-kopplingen misslyckades: "+e.message));else fin("Spotify-kopplingen avbröts");return}}
render();
try{const msg=sessionStorage.getItem(KEY+"-msg");if(msg){sessionStorage.removeItem(KEY+"-msg");toast(msg)}}catch(e){}
if(isAdmin&&SND.mode==="file"&&SND.name)loadSnd();
if(isAdmin&&SND.mode==="spotify")spQuiet();
if(isAdmin&&PIN&&sync.pending)push();
poll();setInterval(()=>{if(document.visibilityState==="visible")poll()},isAdmin?8000:4000);

addEventListener("hashchange",()=>location.reload());
setInterval(()=>{if(!$("#cd"))return;const ms=startAt()-Date.now();if(ms<=0){render();return}const[d,h,m,s]=cdParts(ms);$("#cdD").textContent=d;$("#cdH").textContent=String(h).padStart(2,"0");$("#cdM").textContent=String(m).padStart(2,"0");$("#cdS").textContent=String(s).padStart(2,"0")},1000);
})();
