/* Layout: arenans resultattavla – mörk is-natt, en stor tavla överst, tumvänlig flikrad i botten */
:root{

.pbtn{padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);text-align:left;font-weight:600;overflow-wrap:anywhere;display:flex;gap:8px;align-items:center}

.pbtn .hist{margin-left:auto;font-size:12px;color:var(--pink)}

.jager{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:24px;
background:radial-gradient(circle at 50% 40%,#0f6b4c 0%,#06281d 55%,#020c08 100%)}

.jager .who{font-family:var(--display);font-size:clamp(38px,12vw,96px);line-height:1.05;color:#fff;overflow-wrap:anywhere;max-width:100%}
.jager .team{font-weight:800;letter-spacing:3px;text-transform:uppercase}
.jager.rolling .who{opacity:.85;filter:blur(.5px)}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--amber);color:#1a1200;font-weight:800;padding:10px 18px;border-radius:99px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.goalflash{position:fixed;inset:0;z-index:65;display:flex;align-items:center;justify-content:center;pointer-events:none;font-family:var(--display);font-size:clamp(70px,22vw,200px);color:var(--amber);text-shadow:0 0 40px rgba(255,194,61,.8);animation:gf 1.4s ease-out forwards}
@keyframes gf{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.1);opacity:1}70%{opacity:1}100%{transform:scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.jager .k,.goalflash{animation:none}.btn{transition:none}}
.fk-in{width:5.5em!important;text-align:center}
.matchcard{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.matchcard .res{font-family:var(--display);color:var(--amber);font-size:22px;font-variant-numeric:tabular-nums}
.live{color:var(--mint);font-weight:800;font-size:12px;letter-spacing:2px}
.empty{padding:28px 16px;text-align:center;color:var(--dim)}
.jalert{background:radial-gradient(circle at 30% 30%,#0f6b4c,#06281d);border:2px solid var(--mint);border-radius:16px;padding:16px;text-align:center;margin-bottom:12px}
.jalert .k{font-family:var(--display);color:var(--amber);font-size:22px}
.jalert .who{font-family:var(--display);font-size:clamp(30px,9vw,54px);line-height:1.1;overflow-wrap:anywhere}
.qr{background:#fff;border-radius:14px;padding:12px;width:min(280px,100%);margin:0 auto}
.qr svg{display:block;width:100%;height:auto}
.foot{text-align:center;margin-top:28px}
.minibar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:10px;justify-content:space-between;background:#050a14;border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:12px;box-shadow:0 10px 24px -12px #000}
.minibar .mt{font-family:var(--display);font-size:24px;color:var(--mint);font-variant-numeric:tabular-nums}
.minibar .ms{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;flex:1}
.adj{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.emblem{display:block;width:min(66vw,290px);height:auto;margin:-6px auto 8px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
.emblem.sm{width:min(42vw,180px)}
.foot a{color:var(--dim);font-size:13px}
.fktbl td:first-child{white-space:normal}
</style>

<script>
(function(){
"use strict";
const KEY="svanen-sekretariat-v1";
const COLORS=["#ffc23d","#ff4f9a","#3ee0a8","#4fb3ff","#a34bff","#ff8a3d","#e8eef9","#ff5d5d"];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
function demo(){
const mk=(name,color,ps)=>({id:uid(),name,color,players:ps.map((p,i)=>({id:uid(),name:p,nr:String(i+1)}))});
const teams=[mk("Svanarna","#ffc23d",["Anna","Bosse","Cissi","David"]),mk("Isbjörnarna","#4fb3ff",["Erik","Fia","Göran","Hanna"]),mk("Glöggarna","#ff4f9a",["Ida","Jonte","Kajsa","Leffe"])];
return {demo:true,teams,matches:[],warns:[],
fk:{events:["Straffar","Pucktrixande","Dragkamp","Frågesport","Sista pucken"].map(n=>({id:uid(),name:n})),scores:{},adj:[]},
settings:{win:3,draw:1,useHockey:true,autoJager:true,jMin:4,jMax:12}};
}
const SB_URL="https://mmqduehygpwjsgiglsrj.supabase.co",SB_KEY="sb_publishable_huWKOekQbwRKr-69S1KBeA_46JRRL_4";
const HDR={apikey:SB_KEY,"Content-Type":"application/json"};
async function fetchServer(){const r=await fetch(SB_URL+"/rest/v1/svanen_state?id=eq.main&select=state,updated_at",{headers:HDR,cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();return j[0]||null}
async function rpc(fn,body){const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:HDR,body:JSON.stringify(body)});const j=await r.json().catch(()=>null);if(!r.ok){const e=new Error((j&&j.message)||("HTTP "+r.status));e.code=j&&j.code;throw e}return j}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const isAdmin=location.hash==="#sekretariat";
let PIN=isAdmin?lsGet(KEY+"-pin"):null;
let S=null,loaded=false,netErr=false;
if(isAdmin){try{S=JSON.parse(lsGet(KEY)||"null")}catch(e){S=null}if(!S||!S.teams)S=demo()}
let ui={tab:"match",openMatch:null};
{const t=lsGet(KEY+"-tab");if(t)ui.tab=t}
const sync={pending:lsGet(KEY+"-dirty")==="1",timer:0,seen:null,status:"idle"};
function saveLocal(){lsSet(KEY,JSON.stringify(S))}
function save(){saveLocal();if(isAdmin&&PIN&&!S.demo)queuePush()}
function setSync(st){sync.status=st;const el=$("#sync");if(el)el.outerHTML=syncChip()}
function syncChip(){const m={saving:["Sparar…","var(--amber)"],ok:["Live för alla","var(--mint)"],offline:["Ingen anslutning, sparas här","var(--red)"],idle:["Ansluter…","var(--dim)"],demo:["Exempel, syns inte","var(--dim)"]}[S&&S.demo?"demo":sync.status];return`<span class="chip" id="sync"><span class="dot" style="background:${m[1]}"></span>${m[0]}</span>`}
function queuePush(){sync.pending=true;lsSet(KEY+"-dirty","1");setSync("saving");clearTimeout(sync.timer);sync.timer=setTimeout(push,600)}
async function push(){
const snap=JSON.stringify(S);
try{const t=await rpc("svanen_save",{p_pin:PIN,p_state:S});sync.seen=Date.parse(t);
if(JSON.stringify(S)===snap){sync.pending=false;lsSet(KEY+"-dirty",null);setSync("ok")}else push();
}catch(e){
if(e.code==="28000"){logout("Koden gäller inte längre. Logga in igen.");return}
setSync("offline");clearTimeout(sync.timer);sync.timer=setTimeout(push,5000);
}
}
function isBusy(){const a=document.activeElement;return !!$("#layer").innerHTML||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))}
let prevGoals=null;
async function poll(){
try{
const row=await fetchServer();netErr=false;
if(isAdmin){
if(!PIN)return;
if(!row){if(!S.demo&&!sync.pending)queuePush();else if(sync.status!=="saving")setSync("ok");return}
const t=Date.parse(row.updated_at);
if(sync.pending){if(sync.status==="offline")push();return}
if(sync.seen==null||t>sync.seen){if(isBusy()&&sync.seen!=null)return;S=row.state;sync.seen=t;saveLocal();render()}
if(sync.status!=="saving")setSync("ok");
}else{
S=row?row.state:null;loaded=true;
const m=S&&curMatch(),g=m?m.events.filter(e=>e.type==="goal").length:null;
if(prevGoals!=null&&g!=null&&g>prevGoals){const last=m.events.filter(e=>e.type==="goal").pop();goalFlash(team(last.team))}
prevGoals=g;render();
}
}catch(e){netErr=true;if(isAdmin)setSync("offline");else{loaded=true;render()}}
}
function logout(msg){PIN=null;lsSet(KEY+"-pin",null);render();if(msg)toast(msg)}
const team=id=>S.teams.find(t=>t.id===id);
function player(pid){for(const t of S.teams){const p=t.players.find(p=>p.id===pid);if(p)return{p,t}}return null}
const pname=pid=>{const x=player(pid);return x?x.p.name:"Okänd"};
const curMatch=()=>S.matches.find(m=>m.status==="live");
const FMT_DEF={periods:2,plen:10,otLen:5,tie:"draw",win:3,draw:1,otWin:2,otLoss:1};
function fmtS(){return Object.assign({},FMT_DEF,S.settings||{})}
function pStart(m){return m.pStart||0}
function plenMs(m){const f=fmtS();const L=m.period==="OT"?f.otLen:f.plen;return (+L||0)*60000}
function pClock(m,t){const L=plenMs(m),el=t-pStart(m);return L?Math.max(0,L-el):el}
function periodsList(){const n=Math.max(1,Math.min(4,+fmtS().periods||2));return [...Array(n)].map((_,i)=>i+1).concat(["OT"])}
function isOTWin(m){if(m.status!=="done")return false;const[h,a]=score(m);return !!m.decided||(h!==a&&m.period==="OT")}
function winnerOf(m){const[h,a]=score(m);if(h>a)return m.home;if(a>h)return m.away;return m.decided?m.decided.team:null}
function resLabel(m){const[h,a]=score(m);return`${h}–${a}${m.decided?(m.decided.how==="so"?" (str)":" (SD)"):(m.status==="done"&&m.period==="OT"&&h!==a?" (SD)":"")}`}
function elapsed(m){return m.clock.ms+(m.clock.running?Date.now()-m.clock.since:0)}
function fmt(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function schedJager(m){const a=S.settings.jMin*60000,b=S.settings.jMax*60000;m.nextJager=elapsed(m)+a+Math.random()*Math.max(0,b-a)}
function score(m){let h=0,a=0;for(const e of m.events)if(e.type==="goal"){if(e.team===m.home)h++;else a++}return[h,a]}
function allPenalties(){const out=[];for(const m of S.matches)for(const e of m.events)if(e.type==="pen")out.push({...e,match:m});return out}
function allWarns(){const out=[];for(const m of S.matches)for(const e of m.events)if(e.type==="warn")out.push({...e,match:m});for(const w of S.warns)out.push({...w,match:null});return out}
function playerStats(){
const st={};
for(const t of S.teams)for(const p of t.players)st[p.id]={p,t,g:0,a:0,pim:0,w:0,j:0};
for(const m of S.matches)for(const e of m.events){
const r=st[e.player];if(!r)continue;
if(e.type==="goal"){r.g++;if(e.assist&&st[e.assist])st[e.assist].a++}
if(e.type==="pen")r.pim+=e.min;if(e.type==="warn")r.w++;if(e.type==="jager")r.j++;
}
for(const w of S.warns)if(st[w.player])st[w.player].w++;
return Object.values(st);
}
function hockeyTable(){
const rows={};for(const t of S.teams)rows[t.id]={t,gp:0,w:0,d:0,l:0,gf:0,ga:0,pim:0,warn:0,pts:0};
for(const m of S.matches){

}

case"delEv":for(const x of S.matches)x.events=x.events.filter(e=>e.id!==id);S.warns=S.warns.filter(e=>e.id!==id);break;
case"delMatch":S.matches=S.matches.filter(x=>x!==m);ui.openMatch=null;break;
case"endMatch":if(m){const[a0,b0]=score(m);if(a0===b0&&fmtS().tie!=="draw"&&!m.decided){openDecide(m);return}m.clock.ms=elapsed(m);m.clock.running=false;m.status="done";ui.openMatch=m.id;const[a,b]=score(m);confetti(["#ffc23d","#ff4f9a","#3ee0a8"]);toast(winnerOf(m)?team(winnerOf(m))?.name+" vinner!":"Oavgjort!")}break;
case"delFk":S.fk.events=S.fk.events.filter(e=>e.id!==id);delete S.fk.scores[id];break;
case"delAdj":S.fk.adj=S.fk.adj.filter(a=>a.id!==id);break;
}
save();render();
}
document.addEventListener("click",ev=>{
const el=ev.target.closest("[data-act]");if(!el)return;
const a=el.dataset.act,id=el.dataset.id;
if(a==="bg"){if(ev.target===el)closeLayer();return}
if(a==="arm"){
if(armed===el.dataset.do+id&&Date.now()-armT<3000){armed=null;doArmed(el.dataset.do,id);return}
armed=el.dataset.do+id;armT=Date.now();el.classList.add("armed");el.dataset.orig=el.textContent;el.textContent="Säker? Tryck igen";
setTimeout(()=>{if(el.isConnected){el.classList.remove("armed");el.textContent=el.dataset.orig}},3000);return;
}
const m=ui.openMatch?S.matches.find(x=>x.id===ui.openMatch):curMatch();
switch(a){
case"tab":ui.tab=el.dataset.k;if(ui.tab!=="match")ui.openMatch=null;try{localStorage.setItem(KEY+"-tab",ui.tab)}catch(e){}render();scrollTo(0,0);break;
case"color":team(id).color=el.dataset.c;save();render();break;
case"openMatch":ui.openMatch=id;render();break;
case"closeMatch":ui.openMatch=null;render();break;
case"reopen":if(curMatch()){toast("Avsluta pågående match först");break}m.status="live";delete m.decided;ui.openMatch=null;save();render();break;
case"clock":if(m.clock.running){m.clock.ms=elapsed(m);m.clock.running=false}else{m.clock.since=Date.now();m.clock.running=true;if(m.nextJager==null||m.nextJager<elapsed(m))schedJager(m);wake()}save();render();break;
case"ev":openEvent(el.dataset.type,el.dataset.ctx);break;
case"pickP":
if(pick.step==="assist"){pick.assist=id;saveGoal();break}
pick.player=id;pick.team=el.dataset.t;
if(pick.type==="goal")pick.step="assist";else{pick.step="detail";pick.min=pick.type==="pen"?2:undefined}
drawPick();break;
case"saveGoal":saveGoal();break;
case"pickMin":pick.min=+el.dataset.n;drawPick();break;
case"pickNote":pick.note=el.dataset.n;drawPick();break;
case"saveDetail":{const txt=$("#noteTxt").value.trim();addEv({type:pick.type,player:pick.player,team:pick.team,min:pick.min,note:txt||pick.note||""});
const who=pname(pick.player);closeLayer();render();toast(pick.type==="pen"?`${who} till båset`:`${who} har fått en tillsägelse`);break}
case"close":closeLayer();break;
case"adjClock":{if(!m||m.status!=="live")break;const d=+el.dataset.d,down=plenMs(m)>0;const cur=elapsed(m);let ne=cur+(down?-d:d);ne=Math.max(pStart(m),down?Math.min(ne,pStart(m)+plenMs(m)):ne);m.clock.ms+=ne-cur;save();render();break}
case"swMode":if(SW.running)break;SW.mode=el.dataset.m;SW.ms=0;swSave();render();break;
case"swPreset":if(SW.running)break;SW.down=+el.dataset.v*1000;SW.ms=0;swSave();render();break;
case"swGo":if(SW.running){SW.ms=swEl();SW.running=false}else{if(SW.mode==="down"&&swShown()===0)SW.ms=0;SW.since=Date.now();SW.running=true;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}wake()}swSave();render();break;
case"swLap":{if(!SW.running&&!swEl()){toast("Starta klockan först");break}const w=$("#swWho")?.value||"";SW.laps.push({id:uid(),t:swEl(),who:w});swSave();render();toast(fmtT(swEl())+(w?" "+pname(w):""));break}
case"swReset":SW.running=false;SW.ms=0;swSave();render();break;
case"swDel":SW.laps=SW.laps.filter(l=>l.id!==id);swSave();render();break;
case"nextPeriod":{const L=periodsList(),i=L.findIndex(p=>String(p)===String(m.period));const[h,a]=score(m);
if(i<L.length-2){m.period=L[i+1]}else if(m.period!=="OT"&&h===a&&fmtS().tie==="ot"){m.period="OT"}else{toast("Matchen är slut, tryck Slutsignal");break}
m.pStart=elapsed(m);save();render();toast(m.period==="OT"?"Sudden death! Nästa mål vinner":"Period "+m.period);break}
case"decide":{const cm=curMatch();if(!cm)break;cm.decided={team:el.dataset.t,how:el.dataset.how};closeLayer();doArmed("endMatch");break}
case"genRun":genRun();break;
case"genFill":ui.genText=S.teams.flatMap(t=>t.players.map(p=>p.name)).join("\n");render();break;
case"logout":logout("Utloggad");break;
case"copyUrl":navigator.clipboard?.writeText(publicUrl()).then(()=>toast("Länken är kopierad"),()=>toast(publicUrl()));break;
case"jagerNow":startJager();break;
case"jagerAgain":startJager();break;
case"jagerDone":{const f=pick.jager;const cm=curMatch();delete S.jagerLive;if(!cm)save();
if(f&&cm){cm.events.push({id:uid(),t:Date.now(),type:"jager",player:f.p.id,team:f.t.id,clock:elapsed(cm),per:cm.period,pt:elapsed(cm)-pStart(cm)});schedJager(cm);save()}
closeLayer();render();toast("Skål! Klockan står still tills ni startar den igen");break}
case"copy":{const t=$("#backup");navigator.clipboard?.writeText(t.value).then(()=>toast("Kopierat"),()=>{t.select();toast("Markerat, kopiera själv")})||(t.select());break}
case"import":try{const d=JSON.parse($("#backup").value);if(!d.teams)throw 0;S=d;save();render();toast("Inläst")}catch(e){toast("Texten gick inte att läsa in")}break;
}
});
function saveGoal(){
const t=team(pick.team);addEv({type:"goal",player:pick.player,team:pick.team,assist:pick.assist||null});
closeLayer();render();goalFlash(t);
}
document.addEventListener("submit",ev=>{
ev.preventDefault();const f=ev.target,k=f.dataset.form,id=f.dataset.id;
if(k==="login"){const code=$("#pin").value.trim();if(!code)return;const b=f.querySelector("button");b.disabled=true;b.textContent="Kollar…";
rpc("svanen_check",{p_pin:code}).then(ok=>{if(ok){PIN=code;lsSet(KEY+"-pin",code);sync.seen=null;render();toast("Välkommen in i sekretariatet!");poll()}else{toast("Fel kod");b.disabled=false;b.textContent="Logga in"}})
.catch(()=>{toast("Kommer inte åt servern. Har du nät?");b.disabled=false;b.textContent="Logga in"});return}
if(k==="newPin"){const n=$("#newPin").value.trim();if(n.length<6){toast("Minst 6 tecken");return}
rpc("svanen_set_pin",{p_old:PIN,p_new:n}).then(()=>{PIN=n.toLowerCase();lsSet(KEY+"-pin",PIN);$("#newPin").value="";toast("Koden är bytt")}).catch(e=>toast(e.code==="28000"?"Din gamla kod gäller inte":"Gick inte att byta kod"));return}
if(k==="addTeam"){const v=$("#newTeam").value.trim();if(!v)return;S.teams.push({id:uid(),name:v,color:COLORS[S.teams.length%COLORS.length],players:[]})}
if(k==="addPlayer"){const n=$("#pn-"+id).value.trim();if(!n)return;team(id).players.push({id:uid(),name:n,nr:$("#pnr-"+id).value.trim()});save();render();$("#pn-"+id)?.focus();return}
if(k==="newMatch"){const h=$("#mh").value,a=$("#ma").value;if(h===a){toast("Välj två olika lag");return}if(curMatch()){toast("En match pågår redan");return}
const m={id:uid(),home:h,away:a,status:"live",period:1,events:[],clock:{ms:0,running:false,since:0},nextJager:null};S.matches.push(m);ui.openMatch=null;toast("Nedsläpp!")}
if(k==="addFk"){const v=$("#newFk").value.trim();if(!v)return;S.fk.events.push({id:uid(),name:v})}
if(k==="addAdj"){const p=+$("#ap-"+id).value;if(!p){toast("Skriv antal poäng, t.ex. -2");return}S.fk.adj.push({id:uid(),team:id,pts:p,note:$("#an-"+id).value.trim()||"Justering"})}
save();render();
});
document.addEventListener("change",ev=>{
const el=ev.target,k=el.dataset.change;if(!k)return;
const m=curMatch();
if(k==="teamName"){const v=el.value.trim();if(v)team(el.dataset.id).name=v}
if(k==="period"&&m){m.period=el.value;m.pStart=elapsed(m);save();render();return}
if(k==="fkName"){const e=S.fk.events.find(x=>x.id===el.dataset.id);if(e&&el.value.trim())e.name=el.value.trim()}
if(k==="fkScore"){(S.fk.scores[el.dataset.ev]??={})[el.dataset.t]=el.value===""?"":+el.value;save();return}
if(k==="set")S.settings[el.dataset.k]=+el.value||0;
if(k==="setb")S.settings[el.dataset.k]=el.checked;
if(k==="swWho"){const l=SW.laps.find(x=>x.id===el.dataset.id);if(l){l.who=el.value;swSave();render()}return}
if(k==="sets"){S.settings[el.dataset.k]=el.value;save();render();return}
if(k==="set"&&/^(periods)$/.test(el.dataset.k)){save();render();return}
save();
});
document.addEventListener("input",e=>{if(e.target.id==="genList")ui.genText=e.target.value});
document.addEventListener("toggle",e=>{if(e.target.id==="genBox")ui.genOpen=e.target.open},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#layer").innerHTML&&!$("#jg"))closeLayer()});
setInterval(()=>{
if(!S)return;const m=curMatch();if(!m||!m.clock.running)return;
const onBoard=!isAdmin||(ui.tab==="match"&&!ui.openMatch);
const t=elapsed(m),c=$("#clock");if(c&&onBoard)c.textContent=fmt(pClock(m,t));
const mc=$("#mclock");if(mc)mc.textContent=fmt(pClock(m,t));
if(isAdmin&&PIN&&plenMs(m)&&pClock(m,t)===0){m.clock.ms=t;m.clock.running=false;save();render();
const last=String(m.period)===String(periodsList().slice(-2)[0]);const[h,a]=score(m);
toast(m.period==="OT"?"Förlängningen är slut!":last?(h===a&&fmtS().tie!=="draw"?"Full tid, oavgjort! Dags för "+(fmtS().tie==="so"?"straffar":"förlängning"):"Full tid! Tryck Slutsignal"):"Periodslut! Tryck Nästa period");try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}return}
if(onBoard&&$("#penH")){
const ap=side=>m.events.filter(e=>e.type==="pen"&&e.team===side&&e.clock+e.min*60000>t).map(e=>`${esc(pname(e.player))} ${fmt(e.clock+e.min*60000-t)}`).join("<br>");
$("#penH").innerHTML=ap(m.home);$("#penA").innerHTML=ap(m.away);
}
if(isAdmin&&PIN&&S.settings.autoJager&&m.nextJager!=null&&t>=m.nextJager&&!$("#layer").innerHTML){m.nextJager=null;startJager()}
},500);
setInterval(()=>{if(!SW.running)return;const e=$("#swTime");if(e)e.textContent=fmtT(swShown());
if(SW.mode==="down"&&swShown()===0){SW.ms=SW.down;SW.running=false;swSave();beep();try{navigator.vibrate&&navigator.vibrate([400,150,400])}catch(x){}toast("TID!");if(ui.tab==="femkamp"&&!isBusy())render()}},100);
let lock=null;async function wake(){try{if(!lock&&navigator.wakeLock)lock=await navigator.wakeLock.request("screen");lock?.addEventListener("release",()=>lock=null)}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&curMatch()?.clock.running)wake()});
addEventListener("resize",()=>{if(raf){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}});
render();
if(isAdmin&&PIN&&sync.pending)push();
poll();setInterval(()=>{if(document.visibilityState==="visible")poll()},isAdmin?8000:4000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")poll()});
addEventListener("hashchange",()=>location.reload());
})();
</script>
</body></html>
